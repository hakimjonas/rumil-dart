include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Cross-grammar value comparison (e.g. a JsonTok green compared to a
    # YamlTok green) is a correctness bug in a multi-language parser
    # substrate, not a style nit. Promote the recommended-lint warning to
    # an error. Deliberate cross-type comparisons in tests opt out with a
    # local `// ignore: unrelated_type_equality_checks`.
    unrelated_type_equality_checks: error

linter:
  rules:
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - always_declare_return_types
    - annotate_overrides
    - avoid_dynamic_calls
    - prefer_expression_function_bodies
    - unnecessary_lambdas
    - prefer_single_quotes
    - public_member_api_docs
