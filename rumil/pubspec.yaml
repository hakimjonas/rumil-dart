name: rumil
description: >-
  Parser combinators for Dart with left recursion, stack-safe trampolining,
  typed errors, and lossless green/red syntax trees with resilient parsing
  and incremental reparse.
version: 0.10.0
repository: https://github.com/hakimjonas/rumil-dart
topics:
  - parser
  - combinator
  - parsing
  - syntax-tree
  - incremental

environment:
  sdk: ^3.7.0

dev_dependencies:
  test: ^1.31.0
  lints: ^6.0.0
