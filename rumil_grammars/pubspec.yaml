name: rumil_grammars
description: >-
  Declarative grammar IR for the rumil family plus a tree-sitter
  code generator. Grammars are plain data; the tree-sitter lowering
  emits grammar.json for structural editor backends.
version: 0.1.0
repository: https://github.com/hakimjonas/rumil-dart
topics:
  - parser
  - grammar
  - tree-sitter

environment:
  sdk: ^3.7.0

dev_dependencies:
  test: ^1.31.0
  lints: ^6.0.0
